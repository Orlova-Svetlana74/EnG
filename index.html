<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EnterGen</title>
    <link rel="stylesheet" href="styles.css" />
    <style></style>
  </head>
  <body>
    <!-- Фиксированное меню -->
    <div class="menu">
      <a href="#zeropopup" class="menu__link menu__link-left">EnterGen</a>
      <a href="#contact" class="menu__link menu__link-right">Start a project</a>
    </div>

    <!-- Название -->
    <section class="title">
      <div class="title__text">ENTERGEN DESIGN</div>
    </section>
    <!-- Меню навигации -->
    <nav class="navigation">
      <a class="navigation__link" href="#Заглушка">EnterGen
      <a class="navigation__link" href="#Заглушка">Наши работы</a>
      <a class="navigation__link" id="about-link" href="">О нас</a>
      <a class="navigation__link" href="#Заглушка">Контакты</a>
    </nav>
    <!-- Описание -->
    <section class="description">
      <p class="description__text">
        Entrergen — команда, создающая современные, масштабируемые и эффективные приложения для бизнеса.
      </p>
    </section>

    <!-- Проекты -->
    <section class="projects">
      <div class="projects__item-big">
        <a href="https://mandarin-phi.vercel.app">
          <img
          src="./img/mandarina.png"
          alt="Project 1"
          class="projects__image"
        />
        </a>

      </div>

      <div class="projects__item">
        <a href="https://runkaline.ru">
          <img
          src="./img/runkaline.png"
          alt="Project 2"
          class="projects__image"
        />
        </a>
      </div>
      <div class="projects__item">
        <a href="https://risolut.ru">
          <img
          src="./img/kyxni.png"
          alt="Project 3"
          class="projects__image"
        />
        </a>
      </div>
      <div class="projects__item-big">
        <a href="https://yrs.priem.menu">
          <img
          src="./img/lanshBox.png"
          alt="Project 4"
          class="projects__image"
        />
        </a>

      </div>
    </section>
    <!-- Кнопка ссылка на проекты -->
    <button class="button">All projects</button>
    <!-- Футер -->
    <footer class="footer">
      <section class="footer__contact">
        <a href="mailto:dmdesign.pro@ya.ru">EnteGen@mail.ru</a>
        <a href="#Заглушка">EnterGen</a>
      </section>
      <section class="social">
        <a class="social__link" href="#Заглушка">Lenkidin</a>
        <a class="social__link" href="#Заглушка">Telegram</a>
        <a class="social__link" href="#Заглушка">WhatsApp</a>
      </section>
      <section class="runingLine">
        <span class="runingLine__text">LET'S START A NEW PROJECT </span>
      </section>
    </footer>
    <title>Форма обратной связи</title>

    <div id="modal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Обратная связь</h2>
        <form id="feedback-form">
          <label for="name">Имя:</label>
          <input type="text" id="name" name="name" required />

          <label for="phone">Телефон:</label>
          <input type="tel" id="phone" name="phone" required />

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />

          <button type="submit">Отправить</button>
        </form>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
